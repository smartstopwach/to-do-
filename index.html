<script>
'use strict';
const STORE_KEY='studyCommand.v1';
const DEFAULTS={start:'2026-11-02',end:'2026-12-30',selfStudy:6,liveHours:4,classHours:2,lecHours:2,revHours:1,catchupHours:2,snHours:3,testHours:1,dppMin:25,pyqMin:2,anchorOverride:''};
const PHYSICS=[
 {code:'P2',name:'Electrostatic Potential & Capacitance',lec:0,sn:1,dpp:9,pyq:72,test:1},
 {code:'P3',name:'Current Electricity',lec:0,sn:1,dpp:5,pyq:129,test:1},
 {code:'P4',name:'Moving Charges & Magnetism',lec:0,sn:1,dpp:6,pyq:98,test:1},
 {code:'P5',name:'Magnetism & Matter',lec:0,sn:1,dpp:2,pyq:34,test:1},
 {code:'P6',name:'Electromagnetic Induction',lec:0,sn:1,dpp:4,pyq:50,test:1},
 {code:'P7',name:'Alternating Current',lec:0,sn:1,dpp:3,pyq:66,test:1},

const ORGANIC=[
 {code:'O1',name:'Optical Isomerism',lec:13,sn:1,dpp:10,pyq:0,test:1},
 {code:'O2',name:'Haloalkanes and Haloarenes',lec:19,sn:1,dpp:15,pyq:59,test:1},
 {code:'O3',name:'Alcohols, Phenols and Ethers',lec:12,sn:1,dpp:10,pyq:74,test:1},
 {code:'O4',name:'Aldehydes, Ketones and Carboxylic Acids',lec:10,sn:1,dpp:9,pyq:122,test:1},
 {code:'O5',name:'Amines',lec:4,sn:1,dpp:4,pyq:57,test:1},
 {code:'O6',name:'Biomolecules',lec:3,sn:1,dpp:2,pyq:71,test:1},
 {code:'O7',name:'Practical Organic Chemistry',lec:1,sn:1,dpp:1,pyq:50,test:1}
];
const TASK_NAMES={lec:'Lecture',sn:'Short note',dpp:'DPP sheet',pyq:'PYQ questions',test:'Chapter test'};
const DAY_ROLLOVER_HOUR=4;
function plannerDate(d=new Date()){const day=new Date(d.getTime());if(day.getHours()<DAY_ROLLOVER_HOUR)day.setDate(day.getDate()-1);return localISO(day)}
const TODAY=()=>plannerDate(new Date());
let storageOK=true;
let state=loadState(), selectedDate=TODAY()<state.settings.start?state.settings.start:TODAY(), currentTab='dashboard', calendarMonth='2026-11', computed=null, liveSettingsOpen=false;
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return localISO(d)}
function inRange(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out}
function dateLabel(s,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'}){if(!s)return '—';return parseDate(s).toLocaleDateString('en-IN',opts)}
function revisionTopic(date,start=state.settings.start){const topics=['Physics Ch 1 · Electric Charges and Field','Physics Ch 2 · Electrostatic Potential','Physics Ch 3 · Current Electricity','Physics Ch 4 · Moving Charges & Magnetism','Physics Ch 5 · Magnetism & Matter','Physics Ch 6 · Electromagnetic Induction','Physics Ch 7 · Alternating Current','Physics Ch 8 · Electromagnetic Waves','OC Ch-01','OC Ch-02','OC Ch-03','OC Ch-04','OC Ch-05','OC Ch-06','OC Ch-07'];const offset=Math.max(0,Math.round((parseDate(date)-parseDate(start))/86400000));return topics[offset%topics.length]}
function fmt(n){const x=Number(n)||0;return `${Number(x.toFixed(2))}h`}
function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'C'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function seedBaseline(s,force=false){if(!force&&Number(s.settings?._progressSeedRevision)>=2)return s;const targets={'P2-sn':1,'P2-dpp':6,'P3-pyq':51,'O1-lec':13,'O1-dpp':10,'O2-lec':19,'O3-lec':8,'O3-dpp':1};const benchmarks={...DEFAULTS,...s.settings};for(const [id,want] of Object.entries(targets)){const have=s.log.filter(x=>x.kind===id).reduce((a,x)=>a+(Number(x.qty)||0),0),qty=Math.max(0,want-have);if(!qty)continue;const [code,kind]=id.split('-'),ch=[...PHYSICS,...ORGANIC].find(x=>x.code===code);s.log.push({id:`seed-v2-${id}`,kind:id,qty,h:taskHours(kind,qty,benchmarks),day:'2026-11-01',label:`${code} · ${ch.name} — ${TASK_NAMES[kind]}`,subj:code[0]==='P'?'Physics':'OC'})}s.settings._progressSeedRevision=2;return s}
function normalizeDiscreteUnits(s){if(Number(s.settings?._discreteUnitRevision)>=1)return s;const benchmarks={...DEFAULTS,...s.settings},ids=[...new Set(s.log.filter(x=>/-((dpp)|(pyq))$/.test(String(x.kind))).map(x=>x.kind))];for(const id of ids){const entries=s.log.filter(x=>x.kind===id),kind=id.endsWith('-dpp')?'dpp':'pyq',code=id.split('-')[0],chapter=[...PHYSICS,...ORGANIC].find(x=>x.code===code),limit=chapter?.[kind]??Infinity,total=entries.reduce((a,x)=>a+(Number(x.qty)||0),0);let remaining=Math.min(limit,Math.max(0,Math.round(total+1e-7)));const ranked=entries.map((x,i)=>({x,i,base:Math.max(0,Math.floor(Number(x.qty)||0)),fraction:(Number(x.qty)||0)-Math.floor(Number(x.qty)||0)}));let used=ranked.reduce((a,x)=>a+x.base,0),extra=Math.max(0,remaining-used);ranked.sort((a,b)=>b.fraction-a.fraction||a.i-b.i);for(const row of ranked){if(extra<=0)break;row.base++;extra--}ranked.forEach(row=>{row.x.qty=row.base;row.x.h=taskHours(kind,row.base,benchmarks)});s.log=s.log.filter(x=>!(x.kind===id&&!(Number(x.qty)>0)))}s.settings._discreteUnitRevision=1;return s}
function defaults(){return seedBaseline({settings:{...DEFAULTS},days:{},log:[],custom:[]})}
function loadState(){let raw=null,loaded;try{raw=localStorage.getItem(STORE_KEY);loaded=raw?normalize(JSON.parse(raw)):defaults()}catch(e){console.warn('Local storage read nahi hua; recovery copy banane ki koshish hogi',e);loaded=defaults();if(raw){try{localStorage.setItem(`${STORE_KEY}.recovery`,raw)}catch(recoveryError){console.warn('Recovery copy nahi ban payi',recoveryError)}}}try{localStorage.setItem(STORE_KEY,JSON.stringify(loaded));storageOK=true}catch(e){storageOK=false;console.warn('Local storage write nahi hua',e)}return loaded}
function normalize(s){const d=defaults();if(!s||typeof s!=='object')return d;const out={settings:{...d.settings,...(s.settings||{})},days:s.days&&typeof s.days==='object'?s.days:{},log:Array.isArray(s.log)?s.log:[],custom:Array.isArray(s.custom)?s.custom:[]};const seeded=Number(s.settings?._progressSeedRevision)>=2?out:seedBaseline(out,true);return normalizeDiscreteUnits(seeded)}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('Auto-save fail hua — abhi Export JSON download karein.')}}
function doneQty(id){return state.log.filter(x=>x.kind===id).reduce((a,x)=>a+(Number(x.qty)||0),0)}
function doneHours(date){return state.log.filter(x=>x.day===date).reduce((a,x)=>a+(Number(x.h)||0),0)}
function classCountFrom(meta,s){if(meta&&Object.prototype.hasOwnProperty.call(meta,'classes'))return Math.max(0,Math.floor(Number(meta.classes)||0));if(meta?.live==='none')return 0;return Math.max(0,Math.round((Number(s.liveHours)||0)/Math.max(.25,Number(s.classHours)||2)))}
function missedCountFrom(meta,s){if(meta&&Object.prototype.hasOwnProperty.call(meta,'missedCount'))return clamp(Math.floor(Number(meta.missedCount)||0),0,classCountFrom(meta,s));return meta?.live==='missed'?Math.min(1,classCountFrom(meta,s)):0}
function classCount(date){return classCountFrom(state.days[date]||{},state.settings)}
function missedClassCount(date){return missedCountFrom(state.days[date]||{},state.settings)}
function live(date){const meta=state.days[date]||{};return classCountFrom(meta,state.settings)===0?'none':missedCountFrom(meta,state.settings)>0?'missed':'class'}
function liveHoursFor(date){return classCount(date)*(Number(state.settings.classHours)||2)}
function capacityFrom(meta,s){return (Number(s.selfStudy)||0)+(Number(s.liveHours)||0)-classCountFrom(meta,s)*(Number(s.classHours)||2)+(Number(meta?.extra)||0)}
function taskHours(kind,qty,s){switch(kind){case'lec':return s.lecHours*qty;case'sn':return s.snHours*qty;case'dpp':return s.dppMin/60*qty;case'pyq':return s.pyqMin/60*qty;case'test':return s.testHours*qty;case'rev':return s.revHours*qty;case'catchup':return s.catchupHours*qty;default:return qty}}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
// Deterministic planner. All planned units are assigned from the anchor onward; past days retain only logged work.
function compute(st,todayISO){
 const s={...DEFAULTS,...st.settings};const start=s.start,end=s.end;
 const dayMeta=d=>st.days[d]||{};const logQty=id=>st.log.filter(x=>x.kind===id).reduce((a,x)=>a+(Number(x.qty)||0),0);const logHours=d=>st.log.filter(x=>x.day===d).reduce((a,x)=>a+(Number(x.h)||0),0);const missedFor=d=>missedCountFrom(dayMeta(d),s);
 const anchor=s.anchorOverride&&/^\d{4}-\d\d-\d\d$/.test(s.anchorOverride)?s.anchorOverride:(todayISO>start?todayISO:start);
 const days=inRange(start,end), plan={};days.forEach(d=>plan[d]=[]);
 const warnings={order:[],pending:[],overloaded:[]};
 const allChapters=[...PHYSICS.map(c=>({...c,subj:'Physics'})),...ORGANIC.map(c=>({...c,subj:'OC'}))];
 const specs={};
 allChapters.forEach(ch=>{['lec','sn','dpp','pyq','test'].forEach(k=>{let total=ch[k];if(!total)return;const id=`${ch.code}-${k}`;specs[id]={id,kind:k,subj:ch.subj,ch:ch.code,label:`${ch.code} · ${ch.name} — ${TASK_NAMES[k]}`,total,unitH:taskHours(k,1,s),divisible:['sn','dpp','pyq'].includes(k),chapter:ch.code,step:k}})})
 st.custom.forEach(c=>{specs[c.id]={id:c.id,kind:'custom',subj:c.subj==='OC'?'OC':'Physics',ch:c.ch||'Custom',label:c.label,total:Number(c.total)||0,unitH:Number(c.unitH)||0,divisible:!!c.divisible,custom:true}});
 const loggedById=id=>logQty(id);
 function add(d,item,qty,h,planned=true){if(qty<=1e-8||h<=1e-8)return;plan[d].push({...item,qty,h,planned})}
 function remaining(id,total){return Math.max(0,total-loggedById(id))}
 // Per-day base capacity after actual logged hours. Days before anchor are not rescheduled.
 const cap={};days.forEach(d=>{const meta=dayMeta(d);cap[d]=d<anchor?0:capacityFrom(meta,s)-logHours(d)})
 function placeDivisible(item,qtyRemain,fromDay=anchor){let left=qtyRemain;for(const d of days){if(d<fromDay||left<=1e-8)continue;const avail=Math.max(0,cap[d]);if(avail<=1e-8)continue;let units=Math.min(left,avail/item.unitH);if(item.kind==='dpp'||item.kind==='pyq')units=Math.floor(units+1e-8);else if(item.kind==='sn')units=Math.floor((units+1e-8)*3)/3;if(units>1e-8){const h=units*item.unitH;add(d,item,units,h);cap[d]-=h;left-=units}}return left}
 function placeWhole(item,qtyRemain,fromDay=anchor){const required=item.unitH*qtyRemain;for(const d of days){if(d<fromDay)continue;if(cap[d]+1e-8>=required){add(d,item,qtyRemain,required);cap[d]-=required;return 0}}return qtyRemain}
 // 1. One mandatory pending OC lecture each eligible day; explicitly completed lecture that date counts as day's lecture.

function render(){reflow();document.getElementById('todayPill').textContent=`Aaj · ${dateLabel(TODAY(),{day:'numeric',month:'short'})} · 4 AM reset`;if(currentTab==='dashboard')renderDashboard();if(currentTab==='day')renderDay();if(currentTab==='calendar')renderCalendar();if(currentTab==='backlog')renderBacklog();if(currentTab==='settings')renderSettings()}
function goDay(d){selectedDate=d;setTab('day')}
function logTask(id,d,qty){const t=computed.plan[d]?.find(x=>x.id===id);if(!t)return toast('Task ab plan mein nahi hai; plan refresh ho gaya.');const max=Math.max(0,t.total-doneQty(id));const amount=Number(qty);if(!Number.isFinite(amount)||amount<=0)return toast('Valid quantity enter karo.');if(amount>max+1e-7)return toast(`Maximum ${max.toFixed(2)} unit hi baaki hai.`);if(t.kind==='sn'&&Math.abs(amount*3-Math.round(amount*3))>1e-6)return toast('Short note sirf 1/3, 2/3 ya poora mark hoga.');if((['dpp','pyq','lec','test','catchup'].includes(t.kind)||!t.divisible)&&Math.abs(amount-Math.round(amount))>1e-7)return toast('Is task ke liye poori unit mark karni hogi.');if(!t.divisible&&t.kind!=='catchup'&&Math.abs(amount-t.qty)>1e-7)return toast('Yeh task split nahi hota; poori planned quantity mark karo.');let h;
if(t.kind==='rev')h=Math.min(t.h,amount);else if(['catchup','mock','flex','custom'].includes(t.kind))h=t.unitH*amount;else h=taskHours(t.kind,amount,state.settings);
const entry={id:uid(),kind:id,qty:amount,h,day:d,label:t.label,subj:t.subj};state.log.push(entry);save();render();toast('Progress save ho gaya — plan reflow hua.')}
function handleAction(el){const a=el.dataset.action;if(a==='goto-day')goDay(el.dataset.day);if(a==='shift-date'){const d=addDays(selectedDate,Number(el.dataset.n));if(d>=state.settings.start&&d<=state.settings.end){selectedDate=d;render()}}if(a==='live'){const d=el.dataset.day,meta={...(state.days[d]||{})},baseClasses=Math.max(0,Math.round((Number(state.settings.liveHours)||0)/(Number(state.settings.classHours)||2)));let n=classCount(d);if(el.dataset.val==='none'){n=0;meta.missedCount=0;meta.live='none'}else if(el.dataset.val==='class'){if(n===0)n=baseClasses;meta.missedCount=0;meta.live=n===0?'none':'class'}else{if(n===0)n=baseClasses;meta.missedCount=Math.min(1,n);meta.live=meta.missedCount?'missed':'class'}meta.classes=n;state.days[d]=meta;save();render()}if(a==='class-count'||a==='set-class-count'){const d=el.dataset.day,n=Number(a==='class-count'?el.dataset.count:document.getElementById('classCountInput')?.value);if(!Number.isInteger(n)||n<0||n>12)return toast('Class count 0 se 12 ke beech whole number rakho.');const meta={...(state.days[d]||{})},missed=Math.min(missedClassCount(d),n);meta.classes=n;meta.missedCount=missed;meta.live=n===0?'none':missed?'missed':'class';state.days[d]=meta;save();render();toast(`${n} class · har class ${fmt(state.settings.classHours)}. Plan reflow ho gaya.`)}if(a==='set-missed'||a==='miss-count'){const d=el.dataset.day,n=Number(a==='miss-count'?el.dataset.count:document.getElementById('missedCountInput')?.value),classes=classCount(d);if(!Number.isInteger(n)||n<0||n>classes)return toast(`Missed classes 0 se ${classes} ke beech rakho.`);const meta={...(state.days[d]||{}),classes,missedCount:n,live:n?'missed':classes===0?'none':'class'};state.days[d]=meta;save();render();toast(n?`${n} catch-up class${n===1?'':'es'} add hui.`:'Missed class count reset ho gaya.') }if(a==='set-extra'){const d=el.dataset.day,x=Number(document.getElementById('extraHours')?.value);if(!Number.isFinite(x)||x<0)return toast('Extra hours 0 ya usse zyada rakho.');state.days[d]={...(state.days[d]||{}),extra:x};save();render();toast('Extra hours update ho gaye.')}if(a==='mark'){const q=document.querySelector(`[data-qty="${CSS.escape(el.dataset.id)}"]`);logTask(el.dataset.id,el.dataset.day,q?.value)}if(a==='undo'){state.log=state.log.filter(x=>x.id!==el.dataset.id);save();render();toast('Entry undo ho gayi.')}if(a==='month'){const [y,m]=calendarMonth.split('-').map(Number),dt=new Date(y,m-1+Number(el.dataset.n),1,12);calendarMonth=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;render()}if(a==='delete-custom'){if(confirm('Is custom task ko delete karein? Iske logs bhi remove honge.')){state.custom=state.custom.filter(c=>c.id!==el.dataset.id);state.log=state.log.filter(x=>x.kind!==el.dataset.id);save();render();toast('Custom task delete ho gaya.')}}if(a==='export')exportJSON();if(a==='pick-import')document.getElementById('importFile').click();if(a==='import-text')importJSON(document.getElementById('importText').value);if(a==='reset'){if(confirm('Pakka reset karein? Saara progress, notes aur custom tasks delete honge.')){state=defaults();save();selectedDate=TODAY();render();toast('Default plan restore ho gaya.')}}}
function exportJSON(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`study-command-${TODAY()}.json`;a.click();URL.revokeObjectURL(url);toast('JSON backup download ho gaya.')}catch(e){toast('Export fail hua.')}}
function importJSON(text){try{const next=normalize(JSON.parse(text));if(!next.settings||!Array.isArray(next.log)||!Array.isArray(next.custom))throw Error('Invalid format');state=next;save();document.getElementById('importText').value='';render();toast('Backup import ho gaya.')}catch(e){toast('JSON valid nahi hai — backup format check karo.')}}
document.addEventListener('click',e=>{const summary=e.target.closest('.live-settings summary');if(summary){liveSettingsOpen=!summary.parentElement.open;return}const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}const action=e.target.closest('[data-action]');if(action)handleAction(action)});
document.addEventListener('change',e=>{if(e.target.id==='s-start'||e.target.id==='s-end')updateDateWindowPreview();if(e.target.id==='selectedDate'){const d=e.target.value;if(d>=state.settings.start&&d<=state.settings.end){selectedDate=d;render()}}if(e.target.id==='importFile'&&e.target.files?.[0]){const r=new FileReader();r.onload=()=>importJSON(String(r.result||''));r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='s-start'||e.target.id==='s-end')updateDateWindowPreview();if(e.target.id==='dayNote'){const d=e.target.dataset.day;state.days[d]={...(state.days[d]||{}),note:e.target.value};save()}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();const fd=new FormData(e.target);const next={...state.settings};for(const [k,v] of fd.entries()){next[k]=k==='anchorOverride'?v:(k==='start'||k==='end'?v:Number(v))}if(next.end<next.start)return toast('End date, start date ke baad hona chahiye.');if(next.classHours<=0)return toast('Har live class ka duration zero se zyada hona chahiye.');state.settings=next;if(selectedDate<next.start||selectedDate>next.end)selectedDate=next.start;save();render();toast(`Settings save ho gayi — plan ${dateLabel(next.end,{day:'numeric',month:'short'})} tak reflow hua.`)}if(e.target.id==='customForm'){e.preventDefault();const fd=new FormData(e.target),c={id:uid(),subj:fd.get('subj'),label:String(fd.get('label')).trim(),ch:'Custom',total:Number(fd.get('total')),unitH:Number(fd.get('unitH')),divisible:fd.get('divisible')==='on'};if(!c.label||c.total<=0||c.unitH<=0)return toast('Custom task ki details check karo.');state.custom.push(c);save();e.target.reset();render();toast('Custom task add ho gaya.')}});
try{window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save)}catch(e){console.warn('Page close par final auto-save hook register nahi hua',e)}
// Midnight rollover: today's anchor and dashboard are refreshed without an external service.
setInterval(()=>{if(TODAY()!==window._plannerToday){window._plannerToday=TODAY();render()}},60000);window._plannerToday=TODAY();render();
</script>
