<body>
<div class="shell">
<header class="topbar">
 <div class="brand"><div class="brand-mark">✦</div><div>Study Command<small>Roz ka plan, bina stress</small></div></div>
 <nav class="tabs" aria-label="Main navigation"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="day">Day View</button><button class="tab" data-tab="calendar">Calendar</button><button class="tab" data-tab="backlog">Backlog</button><button class="tab" data-tab="settings">Settings</button></nav>
 <div class="today-pill" id="todayPill"></div>
</header>
<main>
<section class="page active" id="page-dashboard"></section>
<section class="page" id="page-day"></section>
<section class="page" id="page-calendar"></section>
<section class="page" id="page-backlog"></section>
<section class="page" id="page-settings"></section>
</main>
<div class="toast" id="toast" role="status"></div>
</div>
<script>
'use strict';
const STORE_KEY='studyCommand.v1';
const DEFAULTS={start:'2026-11-02',end:'2026-12-30',selfStudy:6,liveHours:4,lecHours:2,revHours:1,catchupHours:2,snHours:3,testHours:1,dppMin:25,pyqMin:2,anchorOverride:''};
const PHYSICS=[
 {code:'P2',name:'Electrostatic Potential & Capacitance',lec:0,sn:1,dpp:3,pyq:72,test:1},
 {code:'P3',name:'Current Electricity',lec:0,sn:1,dpp:5,pyq:78,test:1},
 {code:'P4',name:'Moving Charges & Magnetism',lec:0,sn:1,dpp:6,pyq:98,test:1},
 {code:'P5',name:'Magnetism & Matter',lec:0,sn:1,dpp:2,pyq:34,test:1},
 {code:'P6',name:'Electromagnetic Induction',lec:0,sn:1,dpp:4,pyq:50,test:1},
 {code:'P7',name:'Alternating Current',lec:0,sn:1,dpp:3,pyq:66,test:1},
 {code:'P8',name:'Electromagnetic Waves',lec:0,sn:1,dpp:0,pyq:0,test:1}
];
const ORGANIC=[
 {code:'O1',name:'Optical Isomerism',lec:0,sn:1,dpp:0,pyq:0,test:1},
 {code:'O2',name:'Haloalkanes and Haloarenes',lec:0,sn:1,dpp:15,pyq:59,test:1},
 {code:'O3',name:'Alcohols, Phenols and Ethers',lec:4,sn:1,dpp:9,pyq:74,test:1},
 {code:'O4',name:'Aldehydes, Ketones and Carboxylic Acids',lec:10,sn:1,dpp:9,pyq:122,test:1},
 {code:'O5',name:'Amines',lec:4,sn:1,dpp:4,pyq:57,test:1},
 {code:'O6',name:'Biomolecules',lec:3,sn:1,dpp:2,pyq:71,test:1},
 {code:'O7',name:'Practical Organic Chemistry',lec:1,sn:1,dpp:1,pyq:50,test:1}
];
const TASK_NAMES={lec:'Lecture',sn:'Short note',dpp:'DPP sheet',pyq:'PYQ questions',test:'Chapter test'};
const TODAY=()=>localISO(new Date());
let state=loadState(), selectedDate=TODAY()<state.settings.start?state.settings.start:TODAY(), currentTab='dashboard', calendarMonth='2026-11', computed=null;
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return localISO(d)}
function inRange(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out}
function dateLabel(s,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'}){if(!s)return '—';return parseDate(s).toLocaleDateString('en-IN',opts)}
function revisionTopic(date){const topics=['Physics Ch 1 · Electric Charges and Field','Physics Ch 2 · Electrostatic Potential','Physics Ch 3 · Current Electricity','Physics Ch 4 · Moving Charges & Magnetism','Physics Ch 5 · Magnetism & Matter','Physics Ch 6 · Electromagnetic Induction','Physics Ch 7 · Alternating Current','Physics Ch 8 · Electromagnetic Waves','OC Ch-01','OC Ch-02','OC Ch-03','OC Ch-04','OC Ch-05','OC Ch-06','OC Ch-07'];const offset=Math.max(0,Math.round((parseDate(date)-parseDate(state.settings.start))/86400000));return topics[offset%topics.length]}
function fmt(n){const x=Number(n)||0;return `${Number(x.toFixed(2))}h`}
function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'C'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defaults(){return {settings:{...DEFAULTS},days:{},log:[],custom:[]}}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(raw){const parsed=JSON.parse(raw);return normalize(parsed)}}catch(e){console.warn('Local storage read nahi hua',e)}return defaults()}
function normalize(s){const d=defaults();if(!s||typeof s!=='object')return d;return {settings:{...d.settings,...(s.settings||{})},days:s.days&&typeof s.days==='object'?s.days:{},log:Array.isArray(s.log)?s.log:[],custom:Array.isArray(s.custom)?s.custom:[]}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){toast('Save nahi ho paya — browser storage check karein.')}}
function doneQty(id){return state.log.filter(x=>x.kind===id).reduce((a,x)=>a+(Number(x.qty)||0),0)}
function doneHours(date){return state.log.filter(x=>x.day===date).reduce((a,x)=>a+(Number(x.h)||0),0)}
function live(date){return state.days[date]?.live||'class'}
function taskHours(kind,qty,s){switch(kind){case'lec':return s.lecHours*qty;case'sn':return s.snHours*qty;case'dpp':return s.dppMin/60*qty;case'pyq':return s.pyqMin/60*qty;case'test':return s.testHours*qty;case'rev':return s.revHours*qty;case'catchup':return s.catchupHours*qty;default:return qty}}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
// Deterministic planner. All planned units are assigned from the anchor onward; past days retain only logged work.
function compute(st,todayISO){
 const s={...DEFAULTS,...st.settings};const start=s.start,end=s.end;
 const anchor=s.anchorOverride&&/^\d{4}-\d\d-\d\d$/.test(s.anchorOverride)?s.anchorOverride:(todayISO>start?todayISO:start);
 const days=inRange(start,end), plan={};days.forEach(d=>plan[d]=[]);
 const warnings={order:[],pending:[],overloaded:[]};
 const allChapters=[...PHYSICS.map(c=>({...c,subj:'Physics'})),...ORGANIC.map(c=>({...c,subj:'OC'}))];
 const specs={};
 allChapters.forEach(ch=>{['lec','sn','dpp','pyq','test'].forEach(k=>{let total=ch[k];if(!total)return;const id=`${ch.code}-${k}`;specs[id]={id,kind:k,subj:ch.subj,ch:ch.code,label:`${ch.code} · ${ch.name} — ${TASK_NAMES[k]}`,total,unitH:taskHours(k,1,s),divisible:['sn','dpp','pyq'].includes(k),chapter:ch.code,step:k}})})
 state.custom.forEach(c=>{specs[c.id]={id:c.id,kind:'custom',subj:c.subj==='OC'?'OC':'Physics',ch:c.ch||'Custom',label:c.label,total:Number(c.total)||0,unitH:Number(c.unitH)||0,divisible:!!c.divisible,custom:true}});
 const loggedById=id=>doneQty(id);

<div class="summary-strip"><div class="summary-chip"><b>${fmt(base)}</b><span>Kul samay</span></div><div class="summary-chip"><b>${fmt(used)}</b><span>Plan + ho chuka</span></div><div class="summary-chip"><b>${fmt(free)}</b><span>Bacha samay</span></div><div class="summary-chip"><b>${fmt(done)}</b><span>Ho chuka</span></div></div></div>
<div class="grid two-col section-gap"><div class="card"><h2>Aaj ke tasks <span class="muted">(${plan.length})</span></h2><div class="plan-list">${plan.length?plan.map(t=>taskHTML(t,d)).join(''):'<div class="empty">Is date par koi task schedule nahi hai.</div>'}</div></div><div class="card"><h2>Is din complete hua</h2><div class="plan-list">${daylogs.length?daylogs.map(x=>`<div class="task"><div><div class="row">${subjTag(x.subj||'System')}<span class="task-title">${safe(x.label)}</span></div><div class="task-meta">${Number(x.qty).toFixed(2).replace(/\.00$/,'')} unit · ${fmt(x.h)}</div></div><button class="btn small danger" data-action="undo" data-id="${safe(x.id)}">Undo</button></div>`).join(''):'<div class="empty">Abhi kuch log nahi hua. Done karte hi yahan dikhega.</div>'}</div></div></div>
${showNext?`<div class="card section-gap"><div class="row spread"><div><h2>Kal ka reflow · ${dateLabel(nextDay,{weekday:'short',day:'numeric',month:'short'})}</h2><div class="muted">${status==='none'?'Aaj ke +4h se backlog ka hissa aaj hi aage aaya; kal ki list dobara calculate hui.':'Aaj ke changes ke baad kal ki remaining list.'} Same DPP/PYQ label dikhe to quantity split hai — Done mark karne par baaki plan phir se reflow hoga.</div></div><button class="btn small" data-action="goto-day" data-day="${nextDay}">Kal kholo →</button></div><div class="section-gap">${nextRows||'<div class="empty">Kal ke liye backlog task nahi bacha.</div>'}${nextPlan.length>6?`<div class="footnote">Aur ${nextPlan.length-6} tasks kal schedule hain.</div>`:''}</div><div class="footnote">Kal ka planned load: ${fmt(dayPlannedHours(nextDay))} · Plan finish: ${computed.finishDate?dateLabel(computed.finishDate,{day:'numeric',month:'short'}):'Complete'}</div></div>`:''}
<div class="card section-gap"><h2>Din ke notes</h2><textarea class="note" id="dayNote" data-day="${d}" placeholder="Aaj kya accha hua, kya revise karna hai...">${safe(state.days[d]?.note||'')}</textarea><div class="footnote">Note automatically save hota hai.</div></div>`}
function renderCalendar(){const el=document.getElementById('page-calendar');const [y,m]=calendarMonth.split('-').map(Number);const first=new Date(y,m-1,1,12),offset=(first.getDay()+6)%7,daysIn=new Date(y,m,0,12).getDate();const cells=[];for(let i=0;i<offset;i++)cells.push('<div class="cal-cell blank"></div>');for(let n=1;n<=daysIn;n++){const d=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;if(d<state.settings.start||d>state.settings.end){cells.push('<div class="cal-cell blank"></div>');continue}const base=dayBase(d),done=doneHours(d),plan=dayPlannedHours(d),status=live(d),past=d<TODAY(),isToday=d===TODAY(),over=computed.warnings.overloaded.some(x=>x.day===d),allComplete=past&&plan===0&&done>0;const klass=[past?'past':'',isToday?'today':'',status==='none'?'none':'',status==='missed'?'missed':'',over?'overload':'',allComplete?'complete':''].filter(Boolean).join(' ');const liveText=status==='none'?'No live':status==='missed'?'Live miss':'Live ✓';cells.push(`<button class="cal-cell ${klass}" data-action="goto-day" data-day="${d}"><div class="row spread"><span class="cal-num">${n}</span><span class="cal-week">${parseDate(d).toLocaleDateString('en-IN',{weekday:'short'})}</span></div><div class="cal-stat">${fmt(done+plan)} / ${fmt(base)}h</div><div class="cal-live">${liveText}</div><div class="cal-count">${countPlanned(d)} tasks</div></button>`)}
el.innerHTML=`<div class="calendar-head"><div><h1>Calendar</h1><p class="subtitle">2 Nov se 30 Dec tak har din ka load ek nazar mein.</p></div><div class="row"><button class="btn" data-action="month" data-n="-1">←</button><b>${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="btn" data-action="month" data-n="1">→</button></div></div><div class="cal-legend"><span><i class="dot green"></i>Aaj / complete</span><span><i class="dot blue"></i>No live class</span><span><i class="dot red"></i>Live miss</span><span><i class="dot orange"></i>Overload</span><span>Faded = past</span></div><div class="cal-months">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div>`}
function renderBacklog(){const el=document.getElementById('page-backlog');const chapters=[...computed.chapters];const rows=[];chapters.forEach(ch=>['lec','sn','dpp','pyq','test'].forEach(k=>{const total=ch[k];if(!total)return;const id=`${ch.code}-${k}`,done=Math.min(total,doneQty(id)),left=total-done,unitH=taskHours(k,1,state.settings),plannedDates=Object.keys(computed.plan).filter(d=>computed.plan[d].some(t=>t.id===id));rows.push({subj:ch.subj,chapter:`${ch.code} · ${ch.name}`,label:TASK_NAMES[k],done,total,left,h:left*unitH,finish:plannedDates.length?plannedDates[plannedDates.length-1]:'—',pct:done/total*100,id})}));state.custom.forEach(c=>{const done=Math.min(c.total,doneQty(c.id)),left=c.total-done,dates=Object.keys(computed.plan).filter(d=>computed.plan[d].some(t=>t.id===c.id));rows.push({subj:c.subj,chapter:c.ch||'Custom',label:c.label,done,total:c.total,left,h:left*c.unitH,finish:dates.length?dates[dates.length-1]:'—',pct:done/c.total*100,id:c.id,custom:true})});
el.innerHTML=`<div class="row spread"><div><h1>Backlog</h1><p class="subtitle">Chapter order fixed hai: lec → short note → DPP → PYQ → test.</p></div><span class="tag system">${fmt(computed.remainingBacklogHours)} baaki</span></div><div class="card"><h2>Task progress dekho</h2><div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Task</th><th>Chapter</th><th>Done / total</th><th>Remaining</th><th>Progress</th><th>Planned finish</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${subjTag(r.subj)}</td><td>${safe(r.label)}</td><td>${safe(r.chapter)}</td><td>${Number(r.done.toFixed(2))} / ${r.total}</td><td>${Number(r.left.toFixed(2))} · ${fmt(r.h)}</td><td class="progress-cell"><div class="bar ${r.subj==='OC'?'oc':''}"><i style="width:${r.pct}%"></i></div><span class="muted">${Math.round(r.pct)}%</span></td><td>${r.finish==='—'?'Not scheduled':dateLabel(r.finish,{day:'numeric',month:'short'})}</td><td>${r.custom?`<button class="btn small danger" data-action="delete-custom" data-id="${safe(r.id)}">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card section-gap"><h2>Custom task add karo</h2><form id="customForm" class="inline-form"><div class="field"><label>Subject</label><select name="subj" class="input"><option value="Physics">Physics</option><option value="OC">OC</option></select></div><div class="field" style="flex:1"><label>Task ka naam</label><input class="input" name="label" required maxlength="100" placeholder="Jaise: extra numericals"></div><div class="field"><label>Total units</label><input class="input" name="total" type="number" min="0.01" step="any" required value="1"></div><div class="field"><label>Hours / unit</label><input class="input" name="unitH" type="number" min="0.01" step="any" required value="1"></div><label class="check"><input type="checkbox" name="divisible" checked> Split ho sakta hai</label><button class="btn primary" type="submit">Add task</button></form><p class="footnote">Custom tasks backlog ke baad chapter queue se pehle schedule honge. Chapter-order wale tasks ko chapter codes mein add na karein.</p></div>`}
function renderSettings(){const s=state.settings;const fields=[['selfStudy','Self-study hours/day'],['liveHours','Live class hours'],['lecHours','OC lecture hours'],['snHours','Short note hours'],['testHours','Chapter test hours'],['dppMin','DPP minutes/sheet'],['pyqMin','PYQ minutes/question'],['revHours','Daily revision hours'],['catchupHours','Missed live catch-up hours']];document.getElementById('page-settings').innerHTML=`<div><h1>Settings</h1><p class="subtitle">Plan ke time benchmarks aur date range yahan customize karo.</p></div><div class="card"><form id="settingsForm"><div class="grid settings-grid">${fields.map(([k,label])=>`<div class="field"><label for="s-${k}">${label}</label><input class="input" id="s-${k}" name="${k}" type="number" min="0" step="0.25" value="${safe(s[k])}"></div>`).join('')}<div class="field"><label for="s-end">Plan end date</label><input class="input" id="s-end" name="end" type="date" value="${safe(s.end)}"></div><div class="field"><label for="s-anchorOverride">Anchor override (optional)</label><input class="input" id="s-anchorOverride" name="anchorOverride" type="date" value="${safe(s.anchorOverride||'')}"><span class="muted">Blank rakho = aaj ya start date.</span></div><div class="field"><label for="s-start">Plan start date</label><input class="input" id="s-start" name="start" type="date" value="${safe(s.start)}"></div></div><button class="btn primary section-gap" type="submit">Settings save karo</button></form></div>
<div class="grid two-col section-gap"><div class="card"><h2>Backup</h2><p class="muted">Apna poora plan, progress aur settings JSON file mein save ya restore karo.</p><div class="row"><button class="btn" data-action="export">Export JSON</button><button class="btn" data-action="pick-import">Import JSON</button><input class="file-input" type="file" id="importFile" accept=".json,application/json"></div><div class="field section-gap"><label>JSON paste karke import karo</label><textarea class="note" id="importText" placeholder='{"settings":{},"days":{},"log":[],"custom":[]}'></textarea><button class="btn" data-action="import-text">Paste se import</button></div></div><div class="card"><h2>Reset progress</h2><p class="muted">Saare logs, day settings, notes aur custom tasks hata dega. Default backlog phir se aayega.</p><button class="btn danger" data-action="reset">Reset all progress</button></div></div>
<div class="card section-gap"><h2>Kaise use karein</h2><ol class="howto"><li>Kisi planned task ke saamne quantity check karke <b>Done</b> dabao. Plan turant dobara calculate hoga; galti ho to Undo use karo.</li><li>Koi din miss ho jaye to task ko undone chhod do — unfinished kaam anchor date se aage automatically move hoga.</li><li>Live class na ho to Day View mein <b>Class nahi (+4h)</b> select karo; us din capacity mein chaar ghante judenge.</li><li>Class miss ho to <b>Class miss (catch-up)</b> select karo; recording ke liye catch-up task add hoga.</li><li>Backup ke liye <b>Export JSON</b> dabao. Restore karne ke liye backup file select karo ya JSON paste karke import karo.</li></ol><div class="footnote">Sab data isi browser ke localStorage mein rehta hai. Offline kaam karta hai; private browsing mein storage limited ho sakta hai.</div></div>`}
function render(){reflow();document.getElementById('todayPill').textContent=`Aaj · ${dateLabel(TODAY(),{day:'numeric',month:'short'})}`;if(currentTab==='dashboard')renderDashboard();if(currentTab==='day')renderDay();if(currentTab==='calendar')renderCalendar();if(currentTab==='backlog')renderBacklog();if(currentTab==='settings')renderSettings()}
function goDay(d){selectedDate=d;setTab('day')}
function logTask(id,d,qty){const t=computed.plan[d]?.find(x=>x.id===id);if(!t)return toast('Task ab plan mein nahi hai; plan refresh ho gaya.');const max=Math.max(0,t.total-doneQty(id));const amount=Number(qty);if(!Number.isFinite(amount)||amount<=0)return toast('Valid quantity enter karo.');if(amount>max+1e-7)return toast(`Maximum ${max.toFixed(2)} unit hi baaki hai.`);if((['dpp','pyq','lec','test','catchup'].includes(t.kind)||!t.divisible)&&Math.abs(amount-Math.round(amount))>1e-7)return toast('Is task ke liye poori unit mark karni hogi.');if(!t.divisible&&Math.abs(amount-t.qty)>1e-7)return toast('Yeh task split nahi hota; poori planned quantity mark karo.');let h;
if(t.kind==='rev')h=Math.min(t.h,amount);else if(['catchup','mock','flex','custom'].includes(t.kind))h=t.unitH*amount;else h=taskHours(t.kind,amount,state.settings);
const entry={id:uid(),kind:id,qty:amount,h,day:d,label:t.label,subj:t.subj};state.log.push(entry);save();render();toast('Progress save ho gaya — plan reflow hua.')}
function handleAction(el){const a=el.dataset.action;if(a==='goto-day')goDay(el.dataset.day);if(a==='shift-date'){const d=addDays(selectedDate,Number(el.dataset.n));if(d>=state.settings.start&&d<=state.settings.end){selectedDate=d;render()}}if(a==='live'){const d=el.dataset.day;state.days[d]={...(state.days[d]||{}),live:el.dataset.val};save();render()}if(a==='set-extra'){const d=el.dataset.day,x=Number(document.getElementById('extraHours')?.value);if(!Number.isFinite(x)||x<0)return toast('Extra hours 0 ya usse zyada rakho.');state.days[d]={...(state.days[d]||{}),extra:x};save();render();toast('Extra hours update ho gaye.')}if(a==='mark'){const q=document.querySelector(`[data-qty="${CSS.escape(el.dataset.id)}"]`);logTask(el.dataset.id,el.dataset.day,q?.value)}if(a==='undo'){state.log=state.log.filter(x=>x.id!==el.dataset.id);save();render();toast('Entry undo ho gayi.')}if(a==='month'){const [y,m]=calendarMonth.split('-').map(Number),dt=new Date(y,m-1+Number(el.dataset.n),1,12);calendarMonth=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;render()}if(a==='delete-custom'){if(confirm('Is custom task ko delete karein? Iske logs bhi remove honge.')){state.custom=state.custom.filter(c=>c.id!==el.dataset.id);state.log=state.log.filter(x=>x.kind!==el.dataset.id);save();render();toast('Custom task delete ho gaya.')}}if(a==='export')exportJSON();if(a==='pick-import')document.getElementById('importFile').click();if(a==='import-text')importJSON(document.getElementById('importText').value);if(a==='reset'){if(confirm('Pakka reset karein? Saara progress, notes aur custom tasks delete honge.')){state=defaults();save();selectedDate=TODAY();render();toast('Default plan restore ho gaya.')}}}
function exportJSON(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`study-command-${TODAY()}.json`;a.click();URL.revokeObjectURL(url);toast('JSON backup download ho gaya.')}catch(e){toast('Export fail hua.')}}
function importJSON(text){try{const next=normalize(JSON.parse(text));if(!next.settings||!Array.isArray(next.log)||!Array.isArray(next.custom))throw Error('Invalid format');state=next;save();document.getElementById('importText').value='';render();toast('Backup import ho gaya.')}catch(e){toast('JSON valid nahi hai — backup format check karo.')}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}const action=e.target.closest('[data-action]');if(action)handleAction(action)});
document.addEventListener('change',e=>{if(e.target.id==='selectedDate'){const d=e.target.value;if(d>=state.settings.start&&d<=state.settings.end){selectedDate=d;render()}}if(e.target.id==='importFile'&&e.target.files?.[0]){const r=new FileReader();r.onload=()=>importJSON(String(r.result||''));r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='dayNote'){const d=e.target.dataset.day;state.days[d]={...(state.days[d]||{}),note:e.target.value};save()}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();const fd=new FormData(e.target);const next={...state.settings};for(const [k,v] of fd.entries()){next[k]=k==='anchorOverride'?v:(k==='start'||k==='end'?v:Number(v))}if(next.end<next.start)return toast('End date, start date ke baad hona chahiye.');state.settings=next;if(selectedDate<next.start||selectedDate>next.end)selectedDate=next.start;save();render();toast('Settings save ho gayi.')}if(e.target.id==='customForm'){e.preventDefault();const fd=new FormData(e.target),c={id:uid(),subj:fd.get('subj'),label:String(fd.get('label')).trim(),ch:'Custom',total:Number(fd.get('total')),unitH:Number(fd.get('unitH')),divisible:fd.get('divisible')==='on'};if(!c.label||c.total<=0||c.unitH<=0)return toast('Custom task ki details check karo.');state.custom.push(c);save();e.target.reset();render();toast('Custom task add ho gaya.')}});
// Midnight rollover: today's anchor and dashboard are refreshed without an external service.
setInterval(()=>{if(TODAY()!==window._plannerToday){window._plannerToday=TODAY();render()}},60000);window._plannerToday=TODAY();render();
</script>
</body>
